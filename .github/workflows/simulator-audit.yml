name: Simulator synthetic security tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check netlify/functions/respond-api.js
      - name: Run offline synthetic regression tests
        run: node --test tests/*.test.js
